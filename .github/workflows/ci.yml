name: MyPress CI

on:
  push:
    branches: [main, "work/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, fileinfo, mbstring, curl
          coverage: none
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './uploads/*' -print0 | xargs -0 -n1 php -l
      - name: Smoke tests
        if: hashFiles('tests/run.php') != ''
        run: php tests/run.php
      - name: HTTP end-to-end tests
        if: hashFiles('tests/http-e2e.php') != ''
        run: php tests/http-e2e.php
  mysql:
    name: MySQL 8 integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mypress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_TEST_DSN: mysql:host=127.0.0.1;dbname=mypress_test;charset=utf8mb4
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, fileinfo, mbstring
          coverage: none
      - name: MySQL integration smoke tests
        run: php tests/mysql-smoke.php

  package:
    name: Build staging package
    runs-on: ubuntu-latest
    needs: [php, mysql]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Assemble clean runtime package
        run: |
          mkdir -p dist/mypress
          cp -R admin assets docs includes modules themes uploads dist/mypress/
          cp .htaccess README.md config.sample.php index.php install.php dist/mypress/
          cd dist
          zip -qr mypress-2.0.0-staging.zip mypress
          unzip -t mypress-2.0.0-staging.zip
          sha256sum mypress-2.0.0-staging.zip > mypress-2.0.0-staging.zip.sha256
      - name: Upload staging package
        uses: actions/upload-artifact@v4
        with:
          name: mypress-2.0.0-staging
          path: |
            dist/mypress-2.0.0-staging.zip
            dist/mypress-2.0.0-staging.zip.sha256
          if-no-files-found: error
          retention-days: 14
