name: MyPress CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, fileinfo, mbstring
          coverage: none
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './uploads/*' -print0 | xargs -0 -n1 php -l
      - name: Smoke tests
        run: php tests/run.php
